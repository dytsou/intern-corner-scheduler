version: '3.8'

services:
  scheduler-api:
    build: .
    container_name: scheduler-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scheduler-web
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      - scheduler-api
    restart: unless-stopped
