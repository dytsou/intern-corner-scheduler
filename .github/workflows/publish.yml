name: Publish to npmjs & GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current package version: $VERSION"

      - name: Get package name
        id: package-name
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          SCOPE="${PACKAGE_NAME%%/*}"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Package name: $PACKAGE_NAME"
          echo "Package scope: $SCOPE"

      - name: Check if version exists on npmjs
        id: check-npmjs
        env:
          PACKAGE_NAME: ${{ steps.package-name.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          ERROR_FILE="$RUNNER_TEMP/npmjs-version-check.log"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >"$ERROR_FILE" 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already exists on npmjs, skipping npmjs publish"
          elif grep -qiE 'E404|404 Not Found' "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION is new on npmjs"
          else
            cat "$ERROR_FILE"
            echo "Could not check the npmjs version; stopping instead of treating a registry error as a missing version" >&2
            exit 1
          fi

      - name: Check if version exists on GitHub Packages
        id: check-github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.package-name.outputs.name }}
          PACKAGE_SCOPE: ${{ steps.package-name.outputs.scope }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          npm config set "$PACKAGE_SCOPE:registry" https://npm.pkg.github.com
          npm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"
          ERROR_FILE="$RUNNER_TEMP/github-packages-version-check.log"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >"$ERROR_FILE" 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already exists on GitHub Packages, skipping GitHub Packages publish"
          elif grep -qiE 'E404|404 Not Found' "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION is new on GitHub Packages"
          else
            cat "$ERROR_FILE"
            echo "Could not check the GitHub Packages version; stopping instead of treating a registry error as a missing version" >&2
            exit 1
          fi

      - name: Install dependencies
        if: ${{ steps.check-npmjs.outputs.exists == 'false' || steps.check-github.outputs.exists == 'false' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify package
        if: ${{ steps.check-npmjs.outputs.exists == 'false' || steps.check-github.outputs.exists == 'false' }}
        run: |
          set -euo pipefail
          trap 'rm -f ./*.tgz' EXIT
          pnpm pack

      - name: Publish to npmjs
        if: ${{ steps.check-npmjs.outputs.exists == 'false' }}
        id: publish-npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.package-name.outputs.name }}
          PACKAGE_SCOPE: ${{ steps.package-name.outputs.scope }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          npm config set "$PACKAGE_SCOPE:registry" https://registry.npmjs.org
          npm config set registry https://registry.npmjs.org
          npm config set "//registry.npmjs.org/:_authToken" "$NODE_AUTH_TOKEN"
          pnpm publish --access public --no-git-checks --registry=https://registry.npmjs.org || {
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Version already exists on npmjs, skipping duplicate publish"
              exit 0
            fi
            echo "Failed to publish $PACKAGE_NAME@$PACKAGE_VERSION to npmjs" >&2
            exit 1
          }
        continue-on-error: true

      - name: Publish to GitHub Packages
        if: ${{ steps.check-github.outputs.exists == 'false' }}
        id: publish-github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.package-name.outputs.name }}
          PACKAGE_SCOPE: ${{ steps.package-name.outputs.scope }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          npm config set registry https://npm.pkg.github.com
          npm config set "$PACKAGE_SCOPE:registry" https://npm.pkg.github.com
          npm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"
          pnpm publish --no-git-checks --registry=https://npm.pkg.github.com || {
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Version already exists on GitHub Packages, skipping duplicate publish"
              exit 0
            fi
            echo "Failed to publish $PACKAGE_NAME@$PACKAGE_VERSION to GitHub Packages" >&2
            exit 1
          }
        continue-on-error: true

      - name: Check if release should be created
        id: should-create-release
        env:
          NPMJS_EXISTS: ${{ steps.check-npmjs.outputs.exists }}
          NPMJS_PUBLISH_OUTCOME: ${{ steps.publish-npmjs.outcome }}
          GITHUB_EXISTS: ${{ steps.check-github.outputs.exists }}
          GITHUB_PUBLISH_OUTCOME: ${{ steps.publish-github.outcome }}
        run: |
          NPMJS_READY=false
          GITHUB_READY=false
          NEW_PUBLICATION=false

          if [ "$NPMJS_EXISTS" = "true" ] || [ "$NPMJS_PUBLISH_OUTCOME" = "success" ]; then
            NPMJS_READY=true
          fi
          if [ "$GITHUB_EXISTS" = "true" ] || [ "$GITHUB_PUBLISH_OUTCOME" = "success" ]; then
            GITHUB_READY=true
          fi
          if [ "$NPMJS_PUBLISH_OUTCOME" = "success" ] || [ "$GITHUB_PUBLISH_OUTCOME" = "success" ]; then
            NEW_PUBLICATION=true
          fi

          if [ "$NPMJS_READY" = "true" ] && [ "$GITHUB_READY" = "true" ] && [ "$NEW_PUBLICATION" = "true" ]; then
            echo "should_create=true" >> "$GITHUB_OUTPUT"
            echo "Version is available on both registries: npmjs=$NPMJS_READY, GitHub Packages=$GITHUB_READY"
          else
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "No new registry publication; skipping GitHub Release creation"
          fi

      - name: Create GitHub Release
        if: ${{ steps.should-create-release.outputs.should_create == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: v${{ steps.package-version.outputs.version }}
          prerelease: ${{ contains(steps.package-version.outputs.version, 'beta') || contains(steps.package-version.outputs.version, 'alpha') || contains(steps.package-version.outputs.version, 'rc') }}
          body: |
            ## ${{ steps.package-name.outputs.name }}@${{ steps.package-version.outputs.version }}

            Published to npmjs and GitHub Packages when this version was not already present.

            - npmjs: https://www.npmjs.com/package/${{ steps.package-name.outputs.name }}
            - GitHub Packages: https://github.com/dytsou/intern-corner-scheduler/packages

            Install from npmjs:

            ```bash
            npm install ${{ steps.package-name.outputs.name }}
            # or
            pnpm add ${{ steps.package-name.outputs.name }}
            ```
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        if: always()
        env:
          NPMJS_EXISTS: ${{ steps.check-npmjs.outputs.exists }}
          NPMJS_PUBLISH_OUTCOME: ${{ steps.publish-npmjs.outcome }}
          GITHUB_EXISTS: ${{ steps.check-github.outputs.exists }}
          GITHUB_PUBLISH_OUTCOME: ${{ steps.publish-github.outcome }}
        run: |
          echo "## Publish Summary"
          echo "### npmjs"
          if [ "$NPMJS_EXISTS" = "true" ]; then
            echo "Skipped - version already exists"
          elif [ "$NPMJS_PUBLISH_OUTCOME" = "success" ]; then
            echo "Published successfully"
          elif [ "$NPMJS_PUBLISH_OUTCOME" = "failure" ]; then
            echo "Failed to publish"
          else
            echo "Not attempted"
          fi
          echo "### GitHub Packages"
          if [ "$GITHUB_EXISTS" = "true" ]; then
            echo "Skipped - version already exists"
          elif [ "$GITHUB_PUBLISH_OUTCOME" = "success" ]; then
            echo "Published successfully"
          elif [ "$GITHUB_PUBLISH_OUTCOME" = "failure" ]; then
            echo "Failed to publish"
          else
            echo "Not attempted"
          fi

      - name: Fail if either registry publish failed
        if: ${{ steps.publish-npmjs.outcome == 'failure' || steps.publish-github.outcome == 'failure' }}
        run: exit 1
