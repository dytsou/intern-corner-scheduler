# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --only-binary :all: pip
        pip install --only-binary :all: flake8==7.1.1 pytest==9.1.1
        if [ -f requirements.txt ]; then pip install --only-binary :all: -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app/ tests/ python/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 app/ tests/ python/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # Create pytest.ini dynamically for CI
        cat > pytest.ini << 'EOF'
        [pytest]
        pythonpath = .
        testpaths = tests
        addopts = -v --tb=short
        python_files = test_*.py
        python_classes = Test*
        python_functions = test_*
        EOF
        pytest
